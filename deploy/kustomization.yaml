apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraud
resources:
  - deployment.yaml
  - service.yaml
# Turns config/model.yaml into a ConfigMap with a content-hash suffix. Editing the file changes
# the ConfigMap name, which changes the Deployment's pod template, which triggers a rolling update.
configMapGenerator:
  - name: model-config
    files:
      - config/model.yaml
